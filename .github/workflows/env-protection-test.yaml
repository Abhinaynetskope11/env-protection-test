name: Environment protection test

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # main deploys to production (protected); every other branch uses the open sandbox environment
    environment: ${{ github.ref_name == 'main' && 'production' || 'sandbox' }}
    steps:
      - name: Report context
        run: |
          echo "ref:         ${{ github.ref_name }}"
          echo "actor:       ${{ github.actor }}"
          echo "environment: ${{ github.ref_name == 'main' && 'production' || 'sandbox' }}"
      - name: Authenticate to sandbox
        if: github.ref_name != 'main'
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          npm install --global @salesforce/cli
          echo "$SFDX_AUTH_URL" > "$RUNNER_TEMP/auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/auth.txt" --alias target --set-default >/dev/null
          rm -f "$RUNNER_TEMP/auth.txt"
          echo "connectedStatus: $(sf org display --json | jq -r .result.connectedStatus)"
      - name: Production deploy placeholder
        if: github.ref_name == 'main'
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: echo "Would deploy to production (secret length ${#SFDX_AUTH_URL})"
