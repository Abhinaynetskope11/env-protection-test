name: Environment protection test

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

env:
  # main deploys to production (protected); every other branch uses the open sandbox environment
  TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'sandbox' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'sandbox' }}
    steps:
      - uses: actions/checkout@v4
      - name: Report context
        run: |
          echo "ref:         ${{ github.ref_name }}"
          echo "actor:       ${{ github.actor }}"
          echo "environment: $TARGET_ENV"
      - name: Authenticate to Salesforce
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          npm install --global @salesforce/cli
          echo "$SFDX_AUTH_URL" > "$RUNNER_TEMP/auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/auth.txt" --alias target --set-default >/dev/null
          rm -f "$RUNNER_TEMP/auth.txt"
          echo "connectedStatus: $(sf org display --json | jq -r .result.connectedStatus)"
      - name: Deploy metadata (sandbox)
        if: env.TARGET_ENV == 'sandbox'
        run: sf project deploy start --source-dir force-app --test-level NoTestRun --wait 10
      - name: Validate metadata only (production, check-only)
        if: env.TARGET_ENV == 'production'
        run: sf project deploy start --source-dir force-app --dry-run --test-level NoTestRun --wait 10
